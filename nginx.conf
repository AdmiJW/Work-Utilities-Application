map $uri $asset_cache_control {
    default "no-cache";
    "~*-[a-z0-9_-]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
    ~*\.(png|svg|ico|ttf|woff2)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    add_header Cache-Control $asset_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~* \.(js|css|json|svg|png|ico|ttf|woff2)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
